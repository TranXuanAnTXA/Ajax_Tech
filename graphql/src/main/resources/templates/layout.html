<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GraphQL Project</title>

    <!-- CSS chung -->
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .page-content {
            flex: 1;
        }

        /* =========================
           NAVBAR
           ========================= */

        .navbar {
            background: #343a40;
            padding: 15px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        .navbar-brand {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        .navbar-menu {
            display: flex;
            gap: 25px;
        }

        .navbar-menu a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar-menu a:hover {
            color: #17a2b8;
        }

        /* =========================
           FOOTER
           ========================= */

        .footer {
            background: #343a40;
            color: white;
            padding: 20px 30px;
            margin-top: auto;
        }

        .footer-content {
            max-width: 1100px;
            margin: 0 auto;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;
        }

        @media (max-width: 768px) {

            .footer-content {
                flex-direction: column;
                text-align: center;
            }

            .navbar {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>

    <!-- Cho home.html chèn CSS riêng -->
    <th:block layout:fragment="css"></th:block>

</head>

<body>

    <!-- =========================
         HEADER
         ========================= -->

    <header th:replace="~{fragments/header :: navbar}">
    </header>


    <!-- =========================
         CONTENT
         ========================= -->

    <main class="page-content">

        <div layout:fragment="content">
            Nội dung mặc định
        </div>

    </main>


    <!-- =========================
         FOOTER
         ========================= -->

    <footer th:replace="~{fragments/footer :: footer}">
    </footer>


    <!-- Cho home.html chèn JavaScript riêng -->
    <th:block layout:fragment="script"></th:block>

</body>

</html>
