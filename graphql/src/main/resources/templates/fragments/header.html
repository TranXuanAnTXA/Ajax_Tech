<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${title != null ? title : 'GraphQL Project'}">
        GraphQL Project
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f6fa;
        }

        /* =========================
           NAVBAR
           ========================= */

        .navbar {
            background: #343a40;
            padding: 15px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.15);
        }

        .navbar-brand {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
        }

        .navbar-menu {
            display: flex;
            gap: 25px;
        }

        .navbar-menu a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar-menu a:hover {
            color: #17a2b8;
        }
    </style>
</head>

<body>

<nav th:fragment="navbar" class="navbar">

    <a th:href="@{/home}" class="navbar-brand">
        GraphQL Project
    </a>

    <div class="navbar-menu">

        <a th:href="@{/home}">
            Home
        </a>

        <a th:href="@{/products}">
            Product
        </a>

        <a th:href="@{/categories}">
            Category
        </a>

    </div>

</nav>

</body>
</html>
