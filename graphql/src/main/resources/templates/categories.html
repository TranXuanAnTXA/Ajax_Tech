<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Category</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 1300px;
            margin: 30px auto;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px;
        }

        button {
            border: none;
            padding: 10px 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        .btn-search {
            background: #0d6efd;
            color: white;
        }

        .btn-add {
            background: #198754;
            color: white;
        }

        .btn-edit {
            background: #ffc107;
            color: black;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #212529;
            color: white;
        }

        .category-icon {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .no-image {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eee;
            border-radius: 8px;
            color: #777;
            font-size: 12px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .pagination button {
            background: #e9ecef;
        }

        .pagination button.active {
            background: #0d6efd;
            color: white;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .modal-content {
            width: 500px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .image-preview {
            margin-top: 10px;
        }

        .image-preview img {
            max-width: 200px;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .upload-status {
            margin-top: 10px;
            font-size: 14px;
        }

        .upload-success {
            color: green;
        }

        .upload-error {
            color: red;
        }

        .empty {
            text-align: center;
            padding: 30px;
        }
    </style>
</head>

<body>
<div layout:fragment="content">

    <div class="container">

        <!-- ============================= -->
        <!-- SEARCH -->
        <!-- ============================= -->
        <div class="box">
            <div class="search-box">

                <input
                        type="text"
                        id="keyword"
                        placeholder="Nhập tên category cần tìm..."
                        onkeydown="handleSearchKey(event)">

                <button
                        type="button"
                        class="btn-search"
                        onclick="searchCategories(0)">
                    Tìm kiếm
                </button>

                <button
                        type="button"
                        class="btn-add"
                        onclick="openCreateModal()">
                    + Thêm Category
                </button>

            </div>
        </div>


        <!-- ============================= -->
        <!-- CATEGORY TABLE -->
        <!-- ============================= -->
        <div class="box">

            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Icon</th>
                    <th>Tên Category</th>
                    <th>Thao tác</th>
                </tr>
                </thead>

                <tbody id="categoryTableBody">
                </tbody>
            </table>

            <div
                    id="emptyMessage"
                    class="empty"
                    style="display: none;">
                Không tìm thấy Category.
            </div>

            <div
                    id="pagination"
                    class="pagination">
            </div>

        </div>
    </div>


    <!-- ============================= -->
    <!-- CATEGORY MODAL -->
    <!-- ============================= -->
    <div
            id="categoryModal"
            class="modal">

        <div class="modal-content">

            <h2 id="modalTitle">
                Thêm Category
            </h2>

            <input
                    type="hidden"
                    id="categoryId">


            <!-- NAME -->
            <div class="form-group">

                <label>
                    Tên Category
                </label>

                <input
                        type="text"
                        id="categoryName"
                        placeholder="Nhập tên category">

            </div>


            <!-- IMAGE -->
            <div class="form-group">

                <label>
                    Icon Category
                </label>

                <input
                        type="file"
                        id="categoryIcon"
                        accept="image/*">

                <div
                        id="imagePreview"
                        class="image-preview">
                </div>

                <div
                        id="uploadStatus"
                        class="upload-status">
                </div>

            </div>


            <!-- BUTTON -->
            <div class="modal-buttons">

                <button
                        type="button"
                        class="btn-cancel"
                        onclick="closeModal()">
                    Hủy
                </button>

                <button
                        type="button"
                        class="btn-add"
                        onclick="saveCategory()">
                    Lưu
                </button>

            </div>

        </div>
    </div>


    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->
    <th:block layout:fragment="script">

        <script>

            /* =========================================
               GLOBAL
            ========================================= */

            let currentPage = 0;
            const pageSize = 5;


            /* =========================================
               GRAPHQL
            ========================================= */

            async function callGraphQL(query) {

                const response =
                    await fetch('/graphql', {
                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({
                            query: query
                        })
                    });


                if (!response.ok) {

                    throw new Error(
                        'GraphQL HTTP error: '
                        + response.status
                    );

                }


                const result =
                    await response.json();


                if (result.errors) {

                    console.error(
                        result.errors
                    );

                    throw new Error(
                        result.errors[0].message
                    );

                }


                return result.data;
            }


            /* =========================================
               SEARCH CATEGORY
            ========================================= */

            async function searchCategories(page = 0) {

                currentPage = page;


                const keyword =
                    document
                        .getElementById('keyword')
                        .value
                        .trim();


                const query = `
                    query {

                        searchCategories(
                            keyword: "${escapeGraphQL(keyword)}"
                            page: ${page}
                            size: ${pageSize}
                        ) {

                            content {

                                id
                                name
                                icon

                            }

                            currentPage
                            pageSize
                            totalElements
                            totalPages

                        }

                    }
                `;


                try {

                    const data =
                        await callGraphQL(query);


                    const result =
                        data.searchCategories;


                    renderCategories(
                        result.content
                    );


                    renderPagination(
                        result.currentPage,
                        result.totalPages
                    );

                }
                catch (error) {

                    console.error(error);

                    alert(
                        'Không thể kết nối GraphQL.'
                    );

                }
            }


            /* =========================================
               RENDER CATEGORIES
            ========================================= */

            function renderCategories(categories) {

                const tbody =
                    document.getElementById(
                        'categoryTableBody'
                    );


                const emptyMessage =
                    document.getElementById(
                        'emptyMessage'
                    );


                tbody.innerHTML = '';


                if (
                    !categories ||
                    categories.length === 0
                ) {

                    emptyMessage.style.display =
                        'block';

                    return;
                }


                emptyMessage.style.display =
                    'none';


                categories.forEach(category => {

                    const row =
                        document.createElement('tr');


                    let imageHtml = `
                        <div class="no-image">
                            No image
                        </div>
                    `;


                    if (category.icon) {

                        imageHtml = `
                            <img
                                src="${escapeHtml(category.icon)}"
                                alt="Category icon"
                                class="category-icon"
                                onerror="this.style.display='none';">
                        `;

                    }


                    row.innerHTML = `

                        <td>
                            ${escapeHtml(category.id)}
                        </td>

                        <td>
                            ${imageHtml}
                        </td>

                        <td>
                            ${escapeHtml(category.name)}
                        </td>

                        <td>

                            <button
                                type="button"
                                class="btn-edit"
                                onclick='openEditModal(${JSON.stringify(category)})'>
                                Sửa
                            </button>

                            <button
                                type="button"
                                class="btn-delete"
                                onclick="deleteCategory(${category.id})">
                                Xóa
                            </button>

                        </td>

                    `;


                    tbody.appendChild(row);

                });
            }


            /* =========================================
               PAGINATION
            ========================================= */

            function renderPagination(
                currentPage,
                totalPages
            ) {

                const pagination =
                    document.getElementById(
                        'pagination'
                    );


                pagination.innerHTML = '';


                if (totalPages <= 1) {
                    return;
                }


                /* Previous */

                const previousButton =
                    document.createElement('button');


                previousButton.textContent =
                    '«';


                previousButton.disabled =
                    currentPage === 0;


                previousButton.onclick =
                    function () {

                        searchCategories(
                            currentPage - 1
                        );

                    };


                pagination.appendChild(
                    previousButton
                );


                /* Page numbers */

                for (
                    let page = 0;
                    page < totalPages;
                    page++
                ) {

                    const button =
                        document.createElement(
                            'button'
                        );


                    button.textContent =
                        page + 1;


                    if (
                        page === currentPage
                    ) {

                        button.classList.add(
                            'active'
                        );

                    }


                    button.onclick =
                        function () {

                            searchCategories(page);

                        };


                    pagination.appendChild(
                        button
                    );

                }


                /* Next */

                const nextButton =
                    document.createElement('button');


                nextButton.textContent =
                    '»';


                nextButton.disabled =
                    currentPage >= totalPages - 1;


                nextButton.onclick =
                    function () {

                        searchCategories(
                            currentPage + 1
                        );

                    };


                pagination.appendChild(
                    nextButton
                );
            }


            /* =========================================
               OPEN CREATE
            ========================================= */

            function openCreateModal() {

                document.getElementById(
                    'modalTitle'
                ).textContent =
                    'Thêm Category';


                document.getElementById(
                    'categoryId'
                ).value = '';


                document.getElementById(
                    'categoryName'
                ).value = '';


                document.getElementById(
                    'categoryIcon'
                ).value = '';


                document.getElementById(
                    'imagePreview'
                ).innerHTML = '';


                clearUploadStatus();


                document.getElementById(
                    'categoryModal'
                ).style.display = 'flex';
            }


            /* =========================================
               OPEN EDIT
            ========================================= */

            function openEditModal(category) {

                document.getElementById(
                    'modalTitle'
                ).textContent =
                    'Sửa Category';


                document.getElementById(
                    'categoryId'
                ).value =
                    category.id;


                document.getElementById(
                    'categoryName'
                ).value =
                    category.name || '';


                document.getElementById(
                    'categoryIcon'
                ).value = '';


                const preview =
                    document.getElementById(
                        'imagePreview'
                    );


                preview.innerHTML = '';


                if (category.icon) {

                    preview.innerHTML = `
                        <img
                            src="${escapeHtml(category.icon)}"
                            alt="Category icon">

                        <div style="margin-top:5px;">
                            Ảnh hiện tại
                        </div>
                    `;

                }


                clearUploadStatus();


                document.getElementById(
                    'categoryModal'
                ).style.display = 'flex';
            }


            /* =========================================
               CLOSE MODAL
            ========================================= */

            function closeModal() {

                document.getElementById(
                    'categoryModal'
                ).style.display = 'none';

            }


            /* =========================================
               IMAGE PREVIEW
            ========================================= */

            document
                .getElementById('categoryIcon')
                .addEventListener(
                    'change',
                    function (event) {

                        const file =
                            event.target.files[0];


                        const preview =
                            document.getElementById(
                                'imagePreview'
                            );


                        preview.innerHTML = '';

                        clearUploadStatus();


                        if (!file) {
                            return;
                        }


                        if (
                            !file.type.startsWith(
                                'image/'
                            )
                        ) {

                            alert(
                                'Vui lòng chọn file hình ảnh.'
                            );


                            event.target.value =
                                '';

                            return;
                        }


                        const image =
                            document.createElement(
                                'img'
                            );


                        image.src =
                            URL.createObjectURL(
                                file
                            );


                        image.alt =
                            'Preview';


                        preview.appendChild(
                            image
                        );

                    }
                );


            /* =========================================
               UPLOAD CATEGORY IMAGE
            ========================================= */

            async function uploadCategoryImage() {

                const fileInput =
                    document.getElementById(
                        'categoryIcon'
                    );


                const file =
                    fileInput.files[0];


                /* Không chọn ảnh mới */

                if (!file) {
                    return null;
                }


                if (
                    !file.type.startsWith(
                        'image/'
                    )
                ) {

                    throw new Error(
                        'File được chọn không phải là hình ảnh.'
                    );

                }


                const formData =
                    new FormData();


                formData.append(
                    'file',
                    file
                );


                showUploadStatus(
                    'Đang upload ảnh...',
                    ''
                );


                const response =
                    await fetch(
                        '/api/upload/category',
                        {
                            method: 'POST',
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                if (
                    !response.ok ||
                    !result.success
                ) {

                    throw new Error(
                        result.message ||
                        'Upload ảnh thất bại.'
                    );

                }


                showUploadStatus(
                    'Upload ảnh thành công.',
                    'success'
                );


                return result.imageUrl;
            }


            /* =========================================
               SAVE CATEGORY
            ========================================= */

            async function saveCategory() {

                const id =
                    document.getElementById(
                        'categoryId'
                    ).value;


                const name =
                    document.getElementById(
                        'categoryName'
                    ).value.trim();


                if (!name) {

                    showUploadStatus(
                        'Vui lòng nhập tên Category.',
                        'error'
                    );

                    return;
                }


                try {

                    let imageUrl = null;


                    const fileInput =
                        document.getElementById(
                            'categoryIcon'
                        );


                    if (
                        fileInput.files.length > 0
                    ) {

                        imageUrl =
                            await uploadCategoryImage();

                    }


                    /* ==========================
                       CREATE
                    ========================== */

                    if (!id) {

                        let iconArgument =
                            'null';


                        if (imageUrl) {

                            iconArgument =
                                `"${escapeGraphQL(imageUrl)}"`;

                        }


                        const mutation = `
                            mutation {

                                createCategory(
                                    name: "${escapeGraphQL(name)}"
                                    icon: ${iconArgument}
                                ) {

                                    id
                                    name
                                    icon

                                }

                            }
                        `;


                        const result =
                            await callGraphQL(
                                mutation
                            );


                        if (result.errors) {

                            console.error(
                                result.errors
                            );

                            alert(
                                'Có lỗi khi thêm Category.'
                            );

                            return;
                        }


                        alert(
                            'Thêm Category thành công!'
                        );
                    }


                    /* ==========================
                       UPDATE
                    ========================== */

                    else {

                        /* Nếu không chọn ảnh mới
                           thì lấy ảnh cũ. */

                        if (!imageUrl) {

                            const oldCategory =
                                await getCategoryById(
                                    id
                                );


                            if (
                                oldCategory &&
                                oldCategory.icon
                            ) {

                                imageUrl =
                                    oldCategory.icon;

                            }
                        }


                        let iconArgument =
                            'null';


                        if (imageUrl) {

                            iconArgument =
                                `"${escapeGraphQL(imageUrl)}"`;

                        }


                        const mutation = `
                            mutation {

                                updateCategory(
                                    id: ${id}
                                    name: "${escapeGraphQL(name)}"
                                    icon: ${iconArgument}
                                ) {

                                    id
                                    name
                                    icon

                                }

                            }
                        `;


                        const result =
                            await callGraphQL(
                                mutation
                            );


                        if (result.errors) {

                            console.error(
                                result.errors
                            );

                            alert(
                                'Có lỗi khi cập nhật Category.'
                            );

                            return;
                        }


                        alert(
                            'Cập nhật Category thành công!'
                        );
                    }


                    closeModal();


                    await searchCategories(
                        currentPage
                    );

                }
                catch (error) {

                    console.error(error);

                    showUploadStatus(
                        error.message ||
                        'Có lỗi xảy ra.',
                        'error'
                    );

                }
            }


            /* =========================================
               GET CATEGORY BY ID
            ========================================= */

            async function getCategoryById(id) {

                const query = `
                    query {

                        categories {

                            id
                            name
                            icon

                        }

                    }
                `;


                const result =
                    await callGraphQL(query);


                return result.categories.find(
                    category =>
                        String(category.id) ===
                        String(id)
                );
            }


            /* =========================================
               DELETE CATEGORY
            ========================================= */

            async function deleteCategory(id) {

                const confirmDelete =
                    confirm(
                        'Bạn có chắc muốn xóa Category này không?'
                    );


                if (!confirmDelete) {
                    return;
                }


                const mutation = `
                    mutation {

                        deleteCategory(
                            id: ${id}
                        )

                    }
                `;


                try {

                    const result =
                        await callGraphQL(
                            mutation
                        );


                    if (
                        result.deleteCategory
                    ) {

                        alert(
                            'Xóa Category thành công!'
                        );


                        await searchCategories(
                            currentPage
                        );

                    }
                    else {

                        alert(
                            'Không tìm thấy Category.'
                        );

                    }

                }
                catch (error) {

                    console.error(error);

                    alert(
                        'Không thể kết nối GraphQL.'
                    );

                }
            }


            /* =========================================
               SEARCH ENTER
            ========================================= */

            function handleSearchKey(event) {

                if (
                    event.key === 'Enter'
                ) {

                    searchCategories(0);

                }
            }


            /* =========================================
               ESCAPE GRAPHQL
            ========================================= */

            function escapeGraphQL(value) {

                return String(value)
                    .replace(/\\/g, '\\\\')
                    .replace(/"/g, '\\"')
                    .replace(/\n/g, '\\n')
                    .replace(/\r/g, '\\r');

            }


            /* =========================================
               ESCAPE HTML
            ========================================= */

            function escapeHtml(value) {

                if (
                    value === null ||
                    value === undefined
                ) {

                    return '';

                }


                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');

            }


            /* =========================================
               UPLOAD STATUS
            ========================================= */

            function showUploadStatus(
                message,
                type
            ) {

                const status =
                    document.getElementById(
                        'uploadStatus'
                    );


                status.textContent =
                    message;


                status.className =
                    'upload-status';


                if (
                    type === 'success'
                ) {

                    status.classList.add(
                        'upload-success'
                    );

                }


                if (
                    type === 'error'
                ) {

                    status.classList.add(
                        'upload-error'
                    );

                }

            }


            function clearUploadStatus() {

                const status =
                    document.getElementById(
                        'uploadStatus'
                    );


                status.textContent =
                    '';


                status.className =
                    'upload-status';

            }


            /* =========================================
               CLICK OUTSIDE MODAL
            ========================================= */

            document
                .getElementById('categoryModal')
                .addEventListener(
                    'click',
                    function (event) {

                        if (
                            event.target === this
                        ) {

                            closeModal();

                        }

                    }
                );


            /* =========================================
               INITIALIZE
            ========================================= */

            document.addEventListener(
                'DOMContentLoaded',
                function () {

                    searchCategories(0);

                }
            );

        </script>

    </th:block>

</div>
</body>
</html>
